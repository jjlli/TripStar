name: Build TripStar image

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: tripstar-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: 1sdv/TripStar

jobs:
  build:
    name: Check upstream, build if changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Heartbeat to keep the schedule alive
        run: |
          FILE=.github/keepalive
          LAST=$(cat "$FILE" 2>/dev/null || echo 0)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距上次心跳：${DAYS} 天"
          if [ "$DAYS" -lt 40 ]; then
            echo "未到期，跳过。"
            exit 0
          fi
          echo "$NOW" > "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: keepalive [skip ci]"
          git push origin HEAD:main
          echo "心跳已提交，60 天计时器重置。"

      - name: Resolve upstream commit and image name
        id: up
        run: |
          SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "Upstream main = $SHA"

      - name: Sync this fork with upstream
        continue-on-error: true
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
            -d '{"branch":"main"}' | head -c 400
          echo ""

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already built
        id: gate
        run: |
          if docker buildx imagetools inspect "${IMAGE}:sha-${{ steps.up.outputs.short }}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "该版本已构建过，跳过。"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "发现新版本，开始构建。"
          fi

      - name: Checkout upstream source
        if: steps.gate.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.up.outputs.sha }}
          path: src

      - name: Read upstream version
        if: steps.gate.outputs.needed == 'true'
        id: ver
        run: |
          VER=$(node -p "require('./src/frontend/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.gate.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.up.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            VITE_AMAP_WEB_JS_KEY=${{ secrets.VITE_AMAP_WEB_JS_KEY }}
            VITE_AMAP_SECURITY_JS_CODE=${{ secrets.VITE_AMAP_SECURITY_JS_CODE }}
